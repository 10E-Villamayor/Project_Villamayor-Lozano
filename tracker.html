<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <py-config>
        packages = ['numpy', 'matplotlib']
    </py-config>
    <title>Attendance Tracker</title>
</head>
<body>
    <div class="container-navbar">
      <navbar class="navbar-investigate">
        <a href="list.html">Classmate List</a>
        <a href="tracker.html">Attendance Tracker</a>
        <a href="photo.html">Class Activities</a>
        </navbar>
            </div>
    <br>

    <div class="container mt-4">
        <div class="row justify-content-center align-items-center g-4">
            <div class="col-md-5">
                <div class="card shadow p-4 tracker-card">
                    <h2 class="text-center fw-bold" style="color: rgb(4, 50, 6)">Attendance Tracker</h2>
                    <div class="mt-4">
                        <label class="fw-bold" style="color: rgb(4, 50, 6);">Select Day</label>
                        <select id="day-select" class="form-select mb-3">
                            <option value="0">Monday</option>
                            <option value="1">Tuesday</option>
                            <option value="2">Wednesday</option>
                            <option value="3">Thursday</option>
                            <option value="4">Friday</option>
                        </select>

                        <label class="fw-bold" style="color: rgb(4, 50, 6);">Absences</label>
                        <input type="number" id="absence-input" class="form-control mb-4" placeholder="0">

                        <button py-click="update_data" class="btn btn-button w-100 fw-bold py-2 mb-2">Submit</button>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card graph-card shadow">
                    <div id="plot-target"></div>
                </div>
            </div>
        </div>
    </div>

      <br>
    <footer>
        <p>Erich Villamayor &  Julia Lozano | 10 - Emerald</p>
    </footer>

    <py-script src="TRACKER.py"></py-script>
</body>
</html>
